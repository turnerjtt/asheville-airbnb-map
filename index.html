<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Buncombe County Airbnbs (2020)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">

    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }

        .legend {
            font-family: 'Titillium Web', sans-serif;
            line-height: 40px;
            font-size: 16px;
            width: 190px;
            color: #333333;
            padding: 6px 8px;
            background: white;
            background: rgba(255,255,255,0.5);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .legend i {
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }

        .legend img {
            width: 16px;
            height: 16px;
            margin-right: 3px;
            float: left;
        }

        .legend p {
            font-size: 14px;
            line-height: 20px;
            margin: 0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

</head>
<body>
<!-- Our web map and content will go here -->
<div id="map"></div>
<script>

    // 1. Create a map object.
    var mymap = L.map('map', {
        center: [35.5946, -82.5540], // centered on downtown Asheville
        zoom: 13,
        maxZoom: 18,
        minZoom: 11,
        detectRetina: true
    });

    // 2. Add a base map. (https so it loads on GitHub Pages)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png').addTo(mymap);

    // 3. Null variable that will hold the Airbnb data.
    var airbnb_listings = null;

    // 4. Build up a set of colors from colorbrewer's Dark2 category.
    var colors = chroma.scale('Dark2').mode('lch').colors(3);

    // 5. Dynamically append style classes to this page to shade the markers.
    for (i = 0; i < 3; i++) {
        $('head').append($("<style> .marker-color-" + (i + 1).toString() + " { color: " + colors[i] + "; font-size: 15px; text-shadow: 0 0 3px #ffffff;} </style>"));
    }

    // Airbnb listings: icon colored by property type, popup shows the property type.
    airbnb_listings = L.geoJson.ajax("assets/airbnb_listings.geojson", {
        onEachFeature: function (feature, layer) {
            layer.bindPopup(feature.properties.property_t);
        },
        pointToLayer: function (feature, latlng) {
            var id = 0;
            if (feature.properties.property_t == "Entire house") { id = 0; }
            else if (feature.properties.property_t == "Private room in house") { id = 1; }
            else { id = 2; } // All other property types from attribute table
            return L.marker(latlng, {icon: L.divIcon({className: 'fab fa-airbnb marker-color-' + (id + 1).toString() })});
        },
        attribution: 'Airbnb Listings &copy; Inside Airbnb | Asheville Zoning Districts &copy; City of Asheville Open Data | Base Map &copy; CartoDB | Map Author: Joshua Turner'
    });

    // 6. Set function for color ramp (5 classes of purples).
    // (Separate variable so it doesn't overwrite the marker colors above.)
    var polyColors = chroma.scale('Purples').colors(5);

    // Equal interval classification: range of 133 / 5 classes = ~27 per class.
    function setColor(density) {
        var id = 0;
        if (density > 106) { id = 4; }
        else if (density > 79 && density <= 106) { id = 3; }
        else if (density > 52 && density <= 79) { id = 2; }
        else if (density > 25 && density <= 52) { id = 1; }
        else { id = 0; }
        return polyColors[id];
    }

    // 7. Style function that sets fill color equal to total Airbnbs.
    function style(feature) {
        return {
            fillColor: setColor(feature.properties.total_bnbs),
            fillOpacity: 0.4,
            weight: 2,
            opacity: 1,
            color: '#b4b4b4',
            dashArray: '4'
        };
    }

    // 8. Add zoning district polygons first, then the Airbnbs so the icons draw on top.
    L.geoJson.ajax("assets/zoning_districts.geojson", {
        style: style
    }).addTo(mymap);

    airbnb_listings.addTo(mymap);

    // 9. Create Leaflet Control Object for Legend.
    var legend = L.control({position: 'topright'});

    // 10. Function that runs when legend is added to map.
    legend.onAdd = function () {
        var div = L.DomUtil.create('div', 'legend');
        div.innerHTML += '<b>Airbnbs per District</b><br />';
        div.innerHTML += '<i style="background: ' + polyColors[4] + '; opacity: 0.5"></i><p>107+</p>';
        div.innerHTML += '<i style="background: ' + polyColors[3] + '; opacity: 0.5"></i><p>80-106</p>';
        div.innerHTML += '<i style="background: ' + polyColors[2] + '; opacity: 0.5"></i><p>53-79</p>';
        div.innerHTML += '<i style="background: ' + polyColors[1] + '; opacity: 0.5"></i><p>26-52</p>';
        div.innerHTML += '<i style="background: ' + polyColors[0] + '; opacity: 0.5"></i><p> 0-25</p>';
        div.innerHTML += '<hr><b>Property Type</b><br />';
        div.innerHTML += '<i class="fab fa-airbnb marker-color-1"></i><p>Entire house</p>';
        div.innerHTML += '<i class="fab fa-airbnb marker-color-2"></i><p>Private room in house</p>';
        div.innerHTML += '<i class="fab fa-airbnb marker-color-3"></i><p>Other</p>';
        return div;
    };

    // 11. Add a legend to map.
    legend.addTo(mymap);

    // 12. Add a scale bar to map.
    L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
</html>
